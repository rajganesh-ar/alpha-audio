<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig for the Storybook screenshot browser (playwright.config.ts sets FONTCONFIG_FILE).
  Chromium reads rasterisation settings from fontconfig, so without this file glyphs render
  with whatever the machine defaults to and baselines differ between a laptop, the cloud
  workspace and CI. Every glyph on the pages comes from the self-hosted web fonts. Chromium
  still needs one system typeface as its last-resort fallback, or it drops text altogether:
  Liberation, which the Playwright browser install with system deps puts on CI runners, is the only folder
  listed, and nothing visible renders in it.
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <cachedir prefix="xdg">fontconfig-alpha-visual</cachedir>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
